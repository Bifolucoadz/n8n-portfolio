<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pay · Mossgrove Landscapes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--moss:#1f4d3a;--ink:#1d2a24;--body:#3d4b44;--muted:#6f7d75;--line:#e3ddd0}
*{box-sizing:border-box}
body{margin:0;background:#f4f1ea;color:var(--ink);font:15px/1.55 Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.test{background:#fff3d6;color:#7a5410;text-align:center;font-size:13px;font-weight:600;padding:8px 12px;border-bottom:1px solid #f0dbb0}
.grid{max-width:920px;margin:40px auto;padding:0 18px;display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.order{padding:8px 4px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--moss);margin-bottom:26px}
.k{font-size:13.5px;color:var(--muted)}
.big{font-size:38px;font-weight:700;letter-spacing:-.8px;margin:4px 0 18px}
.item{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.item span:first-child{color:var(--body)}
.pay{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 24px;box-shadow:0 12px 34px rgba(31,77,58,.07)}
h2{font-size:18px;margin:0 0 16px}
label{display:block;font-size:13.5px;font-weight:600;margin:12px 0 6px;color:var(--body)}
input{width:100%;border:1.5px solid #d8d2c4;border-radius:10px;padding:12px 13px;font:15px Inter,sans-serif;color:var(--ink)}
input:focus{outline:0;border-color:var(--moss)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card-in{position:relative}
.card-in svg{position:absolute;right:12px;top:12px}
button{width:100%;margin-top:20px;border:0;border-radius:12px;background:var(--moss);color:#fff;font:600 16px Inter,sans-serif;padding:15px;cursor:pointer}
button:hover{background:#25604a}
button[disabled]{opacity:.6;cursor:wait}
.fine{font-size:12.5px;color:var(--muted);margin-top:14px;display:flex;gap:8px;align-items:center}
.err{color:#a23b2a;font-size:13.5px;min-height:18px;margin-top:10px}
.back{display:inline-block;margin-top:18px;color:var(--muted);font-size:13.5px}
@media (max-width:760px){.grid{grid-template-columns:1fr;margin-top:20px}.big{font-size:32px}}
</style>
</head>
<body>
<div class="test">Test mode: no real payment is taken. Use the test card that's filled in.</div>
<div class="grid">
  <section class="order">
    <div class="brand"><svg width="26" height="26" viewBox="0 0 34 34" aria-hidden="true"><path d="M2 32C2 14 14 2 32 2c0 18-12 30-30 30z" fill="#7bb661"/><path d="M5 29L27 7" stroke="#1f4d3a" stroke-width="2"/></svg><span id="co"></span></div>
    <div class="k" id="what"></div>
    <div class="big" id="amount"></div>
    <div id="items"></div>
    <a class="back" id="back" href="#">← Back to your quote</a>
  </section>
  <section class="pay">
    <h2>Pay by card</h2>
    <form id="f">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email">
      <label for="num">Card number</label>
      <div class="card-in"><input id="num" inputmode="numeric" value="4242 4242 4242 4242"><svg width="34" height="22" viewBox="0 0 34 22"><rect width="34" height="22" rx="4" fill="#e9eef0"/><rect x="4" y="6" width="26" height="3" fill="#b9c3c7"/><rect x="4" y="14" width="10" height="3" rx="1" fill="#b9c3c7"/></svg></div>
      <div class="row"><div><label for="exp">Expiry</label><input id="exp" value="12 / 34"></div><div><label for="cvc">CVC</label><input id="cvc" value="123"></div></div>
      <label for="nm">Name on card</label>
      <input id="nm" autocomplete="cc-name">
      <button id="go" type="submit"></button>
      <div class="err" id="err"></div>
      <div class="fine"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>In live mode this page is Stripe Checkout; card details never touch our systems.</div>
    </form>
  </section>
</div>
<script>
var D = /*__DATA__*/null;
(function () {
  if (!D) return;
  var $ = function (id) { return document.getElementById(id); };
  var gbp = function (n) { return '£' + (Math.round(Number(n || 0) * 100) / 100).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  document.title = 'Pay ' + gbp(D.amount) + ' · ' + D.company;
  $('co').textContent = D.company;
  $('what').textContent = D.label;
  $('amount').textContent = gbp(D.amount);
  $('items').innerHTML = D.items.map(function (i) { return '<div class="item"><span>' + i[0].replace(/</g, '&lt;') + '</span><span>' + gbp(i[1]) + '</span></div>'; }).join('');
  $('email').value = D.email; $('nm').value = D.name;
  $('go').textContent = 'Pay ' + gbp(D.amount);
  $('back').href = D.back;
  $('f').onsubmit = function (e) {
    e.preventDefault();
    if ($('num').value.replace(/\s/g, '') !== '4242424242424242') { $('err').textContent = 'In test mode, use the test card 4242 4242 4242 4242.'; return; }
    $('go').disabled = true; $('go').textContent = 'Processing…'; $('err').textContent = '';
    fetch(D.confirm, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: D.token, kind: D.kind, last4: '4242' }) })
      .then(function (r) { return r.json(); })
      .then(function (r) { if (r.ok) { location.href = r.redirect; } else { $('go').disabled = false; $('go').textContent = 'Pay ' + gbp(D.amount); $('err').textContent = r.message || 'Payment failed.'; } })
      .catch(function () { $('go').disabled = false; $('go').textContent = 'Pay ' + gbp(D.amount); $('err').textContent = 'Could not connect. Please try again.'; });
  };
})();
</script>
</body>
</html>
