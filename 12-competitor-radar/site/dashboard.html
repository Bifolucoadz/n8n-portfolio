<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Competitor Radar · Cobble & Spoke</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--navy:#14213d;--navy2:#1d2d50;--orange:#e4572e;--orange2:#ff7a45;--ink:#1c2430;--body:#475467;--muted:#7a8496;--line:#e6e8ee;--bg:#f4f5f8;--card:#fff;--red:#d1382a;--redbg:#fdecea;--amber:#b7791f;--amberbg:#fff5e1;--green:#2f7d4f;--greenbg:#e7f5ec;--blue:#2f6690;--bluebg:#e8f1f8}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}
.top{background:var(--navy);color:#fff}
.top .in{max-width:1480px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:11px}
.logo b{font-size:17px;letter-spacing:.2px}
.logo span{color:#9fb0d0;font-size:13px;border-left:1px solid #34456b;padding-left:11px}
.sp{flex:1}
.last{color:#b9c6e0;font-size:13px}
.pill{font-size:11px;font-weight:800;letter-spacing:.7px;padding:4px 10px;border-radius:99px;background:#ffd166;color:#4a3500}
.pill.live{background:#9be3b4;color:#0f3d22}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer}
.btn.o{background:var(--orange);color:#fff}
.btn.o:hover{background:#cf4a23}
.btn.g{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn[disabled]{opacity:.6;cursor:wait}
.page{max-width:1480px;margin:0 auto;padding:22px 24px 40px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .k{font-size:12px;font-weight:600;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.6px}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:600;letter-spacing:0}
.kpi .s{font-size:12.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 600px;gap:20px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 22px rgba(20,33,61,.05)}
.card h2{font-size:16px;margin:0;font-weight:800;letter-spacing:-.2px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 18px 6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--body);cursor:pointer}
.chip.on{border-color:var(--navy);background:var(--navy);color:#fff}
.chip .n{opacity:.7;margin-left:4px}
.feed{padding:6px 12px 12px;display:grid;gap:10px}
.item{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:52px 1fr;gap:12px;position:relative}
.item.seen{opacity:.62}
.sig{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:20px;line-height:1}
.sig small{display:block;font-size:9.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-top:2px}
.s5{background:var(--red);color:#fff}.s4{background:var(--orange);color:#fff}.s3{background:var(--amberbg);color:var(--amber)}.s2,.s1{background:#eef0f4;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:3px}
.tag{font-weight:700;color:var(--navy)}
.kind{background:#eef0f4;border-radius:6px;padding:1px 7px;font-weight:600;color:var(--body)}
.hl{font-weight:700;font-size:15px;line-height:1.35}
.why{color:var(--body);margin-top:4px}
.next{margin-top:6px;font-size:13px}
.next b{color:var(--orange)}
.ba{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;margin-top:8px;background:#f6f7fa;border-radius:8px;padding:3px 9px;color:var(--body)}
.ba .was{text-decoration:line-through;color:var(--muted)}
.ba .now{font-weight:700;color:var(--ink)}
.seenbtn{position:absolute;top:12px;right:12px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;font-weight:600}
.seenbtn:hover{color:var(--ink)}
.empty{padding:30px;text-align:center;color:var(--muted)}
table.pos{width:100%;border-collapse:collapse;margin-top:10px}
table.pos th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700}
table.pos th:first-child,table.pos td:first-child{text-align:left}
table.pos td{padding:9px 10px;border-bottom:1px solid #f0f1f5;text-align:right;white-space:nowrap}
table.pos tr.row{cursor:pointer}
table.pos tr.row:hover td{background:#fafbfd}
table.pos tr.sel td{background:#fff4ee}
.ours{font-weight:700}
.ours small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.cell b{display:block;font-size:13.5px}
.cell span{font-size:11.5px;font-weight:700}
.cheaper{color:var(--red)}.dearer{color:var(--green)}.same{color:var(--muted)}
.na{color:#c3c8d2}
.oos{font-size:10.5px;color:var(--muted);font-weight:600}
.chartbox{padding:6px 18px 18px;height:300px}
.health{margin-top:20px}
table.wl{width:100%;border-collapse:collapse;margin:8px 0 0}
table.wl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);text-align:left;padding:8px 18px;border-bottom:1px solid var(--line)}
table.wl td{padding:9px 18px;border-bottom:1px solid #f0f1f5;font-size:13px}
table.wl td.url{color:var(--muted);max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px}
.st.ok{background:var(--greenbg);color:var(--green)}.st.warn{background:var(--amberbg);color:var(--amber)}.st.bad{background:var(--redbg);color:var(--red)}.st.new{background:var(--bluebg);color:var(--blue)}
.m{font-size:11.5px;font-weight:700;color:var(--body);background:#eef0f4;border-radius:6px;padding:1px 7px}
.m.ai{background:#efe9fb;color:#5b3fa0}
form.add{display:flex;gap:8px;padding:14px 18px 18px;flex-wrap:wrap}
form.add input,form.add select{border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;font:13.5px Inter,sans-serif}
form.add input[name=url]{flex:1;min-width:260px}
.toast{position:fixed;right:24px;bottom:24px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);font-size:13.5px;z-index:9;max-width:440px}
.toast.err{background:var(--red)}
@media (max-width:1200px){.kpis{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}.last{display:none}.page{padding:14px}}
</style>
</head>
<body>
<div class="top"><div class="in">
  <div class="logo"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="#3a4d78" stroke-width="2"/><circle cx="16" cy="16" r="8.5" fill="none" stroke="#3a4d78" stroke-width="2"/><path d="M16 16 L27 9" stroke="#ff7a45" stroke-width="2.6" stroke-linecap="round"/><circle cx="16" cy="16" r="2.6" fill="#ff7a45"/><circle cx="22.5" cy="7.5" r="2" fill="#ffd166"/></svg><b>Competitor Radar</b><span id="co">Cobble &amp; Spoke</span></div>
  <div class="sp"></div>
  <span class="last" id="last"></span>
  <span class="pill" id="mode"></span>
  <button class="btn o" id="checkNow">Check now</button>
</div></div>
<div class="page">
  <section class="kpis" id="kpis"></section>
  <div class="grid">
    <section class="card">
      <div class="ch"><h2>What changed</h2><button class="btn g" id="allSeen" style="padding:6px 11px;font-size:12.5px">Mark all as seen</button></div>
      <div class="chips" id="chips"></div>
      <div class="feed" id="feed"></div>
    </section>
    <div>
      <section class="card">
        <div class="ch"><h2>Where we stand on price</h2><span style="font-size:12px;color:var(--muted)">Rival's matched bike vs ours</span></div>
        <div style="padding:0 8px 8px"><table class="pos" id="pos"></table></div>
      </section>
      <section class="card" style="margin-top:20px">
        <div class="ch"><h2 id="chartTitle">Price history</h2></div>
        <div class="chartbox"><canvas id="chart"></canvas></div>
      </section>
    </div>
  </div>
  <section class="card health">
    <div class="ch"><h2>Pages we watch</h2><span style="font-size:12px;color:var(--muted)" id="runsInfo"></span></div>
    <table class="wl" id="wl"></table>
    <form class="add" id="addForm">
      <input name="competitor" placeholder="Competitor" required>
      <select name="page_type"><option value="products">Products and prices</option><option value="home">Home page</option><option value="careers">Careers</option><option value="news">News or blog</option></select>
      <input name="url" type="url" placeholder="https://competitor.example/ebikes" required>
      <button class="btn o" type="submit">Watch this page</button>
    </form>
  </section>
</div>
<script>
var D = /*__DATA__*/null;
(function () {
  if (!D) return;
  var $ = function (id) { return document.getElementById(id); };
  var gbp = function (n) { return n === '' || n == null ? '' : '£' + Number(n).toLocaleString('en-GB', { maximumFractionDigits: 0 }); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var NOW = new Date(D.now);
  var state = { filter: 'all', sku: null };
  var KIND = { price_drop: 'Price cut', price_rise: 'Price rise', new_product: 'New product', removed_product: 'Product gone', out_of_stock: 'Out of stock', back_in_stock: 'Back in stock', promotion: 'Promotion', hiring: 'Hiring', news: 'News', messaging: 'Messaging', layout_warning: 'Check page', fetch_failed: 'Page down', other: 'Change' };
  var SIG = { 5: 'Urgent', 4: 'High', 3: 'Note', 2: 'Minor', 1: 'Noise' };
  var FILTERS = [['all', 'All', function () { return true; }], ['alerts', 'Alerts', function (c) { return c.significance >= D.settings.alert_threshold; }], ['prices', 'Prices', function (c) { return /price/.test(c.kind); }], ['products', 'Products and stock', function (c) { return /product|stock/.test(c.kind); }], ['promo', 'Promotions', function (c) { return c.kind === 'promotion' || c.kind === 'messaging'; }], ['news', 'Hiring and news', function (c) { return c.kind === 'hiring' || c.kind === 'news'; }], ['issues', 'Page issues', function (c) { return c.kind === 'layout_warning' || c.kind === 'fetch_failed'; }]];
  function ago(iso) { if (!iso) return 'never'; var m = Math.round((NOW - new Date(iso)) / 6e4); if (m < 1) return 'just now'; if (m < 60) return m + ' min ago'; var h = Math.round(m / 60); if (h < 24) return h + ' h ago'; var d = Math.round(h / 24); return d === 1 ? 'yesterday' : d + ' days ago'; }
  function dshort(iso) { return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); }

  // Latest price for each competitor product, and the history
  function latest() {
    var o = {};

  }
  function rivalFor(sku, competitor, last) {
    var ms = D.matches.filter(function (m) { return m.our_sku === sku && m.competitor === competitor; });

    var rank = { high: 0, medium: 1, low: 2 }, bestRank = 9;
    ms.forEach(function (m) { var p = last[m.competitor + '|' + m.competitor_product]; if (!p) return; var r = rank[m.confidence] === undefined ? 1 : rank[m.confidence]; if (!best || r < bestRank || (r === bestRank && Math.abs(p.price - ourPrice(sku)) < Math.abs(best.price - ourPrice(sku)))) { best = p; bestRank = r; } });
    return best;
  }
  function ourPrice(sku) { var p = D.ours.find(function (x) { return x.sku === sku; }); return p ? Number(p.price) : 0; }

  function kpis() {

    var alerts = week.filter(function (c) { return c.significance >= D.settings.alert_threshold; });
    var moves = week.filter(function (c) { return /price/.test(c.kind); });
    var cuts = moves.filter(function (c) { return c.kind === 'price_drop'; }).length;
    var last = latest(), under = 0;
    D.ours.forEach(function (o) { if (D.competitors.some(function (c) { var r = rivalFor(o.sku, c, last); return r && r.price < Number(o.price); })) under++; });

    var t = [['Changes this week', week.length, alerts.length + ' important enough to alert'], ['Price moves', moves.length, cuts + ' cuts, ' + (moves.length - cuts) + ' rises'], ['Rivals cheaper than us', under + ' <small>of ' + D.ours.length + ' bikes</small>', 'on their closest match'], ['Pages healthy', healthy + ' <small>of ' + D.watchlist.length + '</small>', D.watchlist.length - healthy ? (D.watchlist.length - healthy) + ' need a look' : 'all reading fine'], ['AI calls this week', aiWeek, 'only when a page changed']];
    $('kpis').innerHTML = t.map(function (x) { return '<div class="kpi"><div class="k">' + x[0] + '</div><div class="v">' + x[1] + '</div><div class="s">' + x[2] + '</div></div>'; }).join('');
  }

  function feed() {

    var f = FILTERS.find(function (x) { return x[0] === state.filter; })[2];
    var rows = D.changes.filter(f).sort(function (a, b) { return a.detected_at === b.detected_at ? b.significance - a.significance : (a.detected_at < b.detected_at ? 1 : -1); });
    $('feed').innerHTML = rows.length ? rows.slice(0, 60).map(function (c) {
      var ba = '';
      if (/price/.test(c.kind)) ba = '<span class="ba"><span class="was">' + gbp(c.before) + '</span>→<span class="now">' + gbp(c.after) + '</span>' + (c.delta_pct ? ' (' + (c.delta_pct > 0 ? '+' : '') + c.delta_pct + '%)' : '') + (c.our_price ? ' · ours ' + gbp(c.our_price) : '') + '</span>';
      else if (c.kind === 'new_product') ba = '<span class="ba">New at <span class="now">' + gbp(c.after) + '</span>' + (c.our_price ? ' · ours ' + gbp(c.our_price) : '') + '</span>';
      var s = Math.max(1, Math.min(5, c.significance));
      return '<div class="item' + (c.status === 'seen' ? ' seen' : '') + '"><div class="sig s' + s + '">' + s + '<small>' + SIG[s].split(' ')[0] + '</small></div><div><div class="meta"><span class="tag">' + esc(c.competitor) + '</span><span class="kind">' + esc(KIND[c.kind] || c.kind) + '</span><span>' + dshort(c.detected_at) + '</span></div><div class="hl">' + esc(c.headline) + '</div>' + (c.why_it_matters ? '<div class="why">' + esc(c.why_it_matters) + '</div>' : '') + (c.suggested_action && !/^no action/i.test(c.suggested_action) ? '<div class="next"><b>Next step:</b> ' + esc(c.suggested_action) + '</div>' : '') + ba + '</div>' + (c.status === 'seen' ? '' : '<button class="seenbtn" data-seen="' + c.change_id + '">Mark seen</button>') + '</div>';

  }

  function position() {
    var last = latest();
    var h = '<tr><th>Our bike</th>' + D.competitors.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr>';
    D.ours.forEach(function (o) {
      if (!state.sku) state.sku = o.sku;
      h += '<tr class="row' + (state.sku === o.sku ? ' sel' : '') + '" data-sku="' + o.sku + '"><td class="ours">' + esc(o.name) + '<small>' + gbp(o.price) + '</small></td>' + D.competitors.map(function (c) {
        var r = rivalFor(o.sku, c, last);
        if (!r) return '<td class="na">–</td>';
        var d = r.price - Number(o.price), pct = Math.round(d / Number(o.price) * 100);
        return '<td class="cell"><b>' + gbp(r.price) + (r.in_stock === 'no' ? ' <span class="oos">sold out</span>' : '') + '</b><span class="' + (d < 0 ? 'cheaper' : (d > 0 ? 'dearer' : 'same')) + '">' + (d === 0 ? 'same' : (d < 0 ? '−' : '+') + gbp(Math.abs(d)) + ' (' + (pct > 0 ? '+' : '') + pct + '%)') + '</span></td>';
      }).join('') + '</tr>';
    });
    $('pos').innerHTML = h;

  var chart = null;
  function drawChart() {
    var o = D.ours.find(function (x) { return x.sku === state.sku; }); if (!o || !window.Chart) return;
    $('chartTitle').textContent = 'Price history: ' + o.name + ' vs rivals';
    var ms = D.matches.filter(function (m) { return m.our_sku === o.sku; });
    var dates = Array.from(new Set(D.prices.map(function (p) { return p.checked_at.slice(0, 10); }))).sort();
    if (!dates.length) dates = [D.now.slice(0, 10)];

    var sets = [{ label: 'Ours: ' + o.name, data: dates.map(function () { return Number(o.price); }), borderColor: '#14213d', borderWidth: 3, borderDash: [6, 4], pointRadius: 0, stepped: true }];
    ms.forEach(function (m, i) {
      var hist = D.prices.filter(function (p) { return p.competitor === m.competitor && p.product === m.competitor_product; });

      sets.push({ label: m.competitor + ': ' + m.competitor_product, data: data, borderColor: colors[i % colors.length], backgroundColor: colors[i % colors.length], borderWidth: 2, pointRadius: 3, stepped: true, spanGaps: true });

    chart = new Chart($('chart'), { type: 'line', data: { labels: dates.map(function (d) { return dshort(d + 'T12:00:00'); }), datasets: sets }, options: { maintainAspectRatio: false, animation: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { family: 'Inter', size: 11 } } }, tooltip: { callbacks: { label: function (c) { return c.dataset.label + ': ' + gbp(c.parsed.y); } } } }, scales: { y: { ticks: { callback: function (v) { return gbp(v); }, font: { family: 'Inter', size: 11 } }, grid: { color: '#eef0f4' } }, x: { grid: { display: false }, ticks: { font: { family: 'Inter', size: 11 } } } } } });
  }

  function watchlist() {
    var h = '<tr><th>Page</th><th>Competitor</th><th>Read by</th><th>Last checked</th><th>Status</th><th>URL</th></tr>';
    h += D.watchlist.map(function (w) {
      var s = String(w.last_status || 'new'), cls = /fail/.test(s) ? 'bad' : (/warn/.test(s) ? 'warn' : (s === 'new' || !w.last_checked ? 'new' : 'ok'));
      var label = cls === 'bad' ? 'Failing (' + w.fail_count + '×)' : (cls === 'warn' ? 'Check page' : (cls === 'new' ? 'Not checked yet' : (s === 'baseline' ? 'First snapshot' : (s === 'unchanged' ? 'No change' : 'Changed'))));
      var m = w.last_method === 'ai' ? '<span class="m ai">AI reader</span>' : (w.last_method === 'json-ld' ? '<span class="m">Structured data</span>' : '<span class="m">Text</span>');
      return '<tr><td><b>' + esc({ products: 'Products and prices', home: 'Home page', careers: 'Careers', news: 'News' }[w.page_type] || w.page_type) + '</b></td><td>' + esc(w.competitor) + '</td><td>' + (w.last_checked ? m : '') + '</td><td>' + ago(w.last_checked) + '</td><td><span class="st ' + cls + '">' + label + '</span></td><td class="url" title="' + esc(w.url) + '">' + esc(w.url.replace(/^https?:\/\//, '')) + '</td></tr>';
    }).join('');

    $('last').textContent = r ? 'Checked ' + ago(r.started_at) : 'Not checked yet';
  }

  function toast(t, err) { var d = document.createElement('div'); d.className = 'toast' + (err ? ' err' : ''); d.textContent = t; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 4500); }
  function act(body, btn, done) {
    if (btn) btn.disabled = true;
    fetch('action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ key: D.key }, body)) })
      .then(function (r) { return r.json(); })
      .then(function (r) { if (btn) btn.disabled = false; if (!r.ok) { toast(r.message || 'That didn\'t work.', true); return; } if (r.data) D = Object.assign(D, r.data); NOW = new Date(D.now); render(); toast(r.message || 'Done'); if (done) done(); })
      .catch(function () { if (btn) btn.disabled = false; toast('Could not reach n8n.', true); });
  }
  function render() { kpis(); feed(); position(); drawChart(); watchlist(); }
  document.addEventListener('click', function (e) {
    var f = e.target.closest('[data-f]'); if (f) { state.filter = f.getAttribute('data-f'); feed(); return; }
    var s = e.target.closest('[data-seen]'); if (s) { act({ action: 'seen', change_ids: [s.getAttribute('data-seen')] }); return; }
    var r = e.target.closest('tr[data-sku]'); if (r) { state.sku = r.getAttribute('data-sku'); position(); drawChart(); }
  });
  $('allSeen').onclick = function () { var ids = D.changes.filter(function (c) { return c.status !== 'seen'; }).map(function (c) { return c.change_id; }); if (ids.length) act({ action: 'seen', change_ids: ids }, $('allSeen')); };
  $('checkNow').onclick = function () { var b = $('checkNow'); b.textContent = 'Checking…'; act({ action: 'check_now' }, b, function () { b.textContent = 'Check now'; }); setTimeout(function () { b.textContent = 'Check now'; }, 120000); };
  $('addForm').onsubmit = function (e) { e.preventDefault(); var fd = new FormData(e.target); act({ action: 'add_page', competitor: fd.get('competitor'), page_type: fd.get('page_type'), url: fd.get('url') }, e.target.querySelector('button'), function () { e.target.reset(); }); };
  $('co').textContent = D.settings.company;
  $('mode').textContent = D.settings.mode === 'live' ? 'LIVE' : 'TEST MODE';
  if (D.settings.mode === 'live') $('mode').classList.add('live');
  render();
})();
</script>
</body>
</html>
